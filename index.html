<!doctype html>
<html lang="es" data-bs-theme="light" translate="no">
<head>
  <meta charset="utf-8">
  <!-- La interfaz ya esta en espanol: el traductor del navegador la "traducia" (Ventas -> Vientos) -->
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Administración — Comercial Elite</title>
  <meta name="description" content="Administración de Comercial Elite: productos, inventario, compras, ventas, talento humano y usuarios.">
  <meta name="robots" content="noindex, nofollow">
  <!-- Tema antes de pintar (evita el destello de tema equivocado) -->
  <script src="js/tema-inicial.js"></script>
  <script src="js/config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <a class="visually-hidden-focusable btn btn-primary saltar" href="#contenido">Saltar al contenido principal</a>

  <div class="app" id="app">
    <header class="app-encabezado" id="encabezado">
      <button class="btn btn-outline-light d-lg-none" type="button" id="botonMenu" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-controls="menu" hidden>
        Menú
      </button>
      <a class="marca" href="#/">
        <span class="marca-sello" aria-hidden="true">CE</span>
        <span>Comercial Elite <span class="marca-sub">Administración</span></span>
      </a>
      <div class="encabezado-acciones">
        <button class="btn btn-outline-light btn-sm" type="button" id="botonTema" aria-pressed="false">Tema oscuro</button>
        <div id="zonaUsuario" class="d-flex flex-wrap align-items-center gap-2"></div>
      </div>
    </header>

    <nav class="app-menu offcanvas-lg offcanvas-start" id="menu" tabindex="-1" aria-label="Menú principal" hidden>
      <div class="offcanvas-header d-lg-none">
        <p class="offcanvas-title h5 mb-0" id="tituloMenu">Menú</p>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#menu" aria-label="Cerrar menú"></button>
      </div>
      <div class="offcanvas-body p-0" id="contenidoMenu"></div>
    </nav>

    <main class="app-contenido" id="contenido" tabindex="-1">
      <div class="d-flex align-items-center gap-2 my-5" role="status">
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        <span>Cargando la administración…</span>
      </div>
      <noscript>
        <div class="alert alert-warning">La administración necesita JavaScript activado.</div>
      </noscript>
    </main>

    <footer class="app-pie">
      <p class="mb-0 small">Comercial Elite · Administración · Los datos se guardan en la base de producción.</p>
    </footer>
  </div>

  <!-- Anuncios para lectores de pantalla -->
  <div class="visually-hidden" id="anuncio" role="status" aria-live="polite"></div>
  <div class="visually-hidden" id="anuncioUrgente" role="alert" aria-live="assertive"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
